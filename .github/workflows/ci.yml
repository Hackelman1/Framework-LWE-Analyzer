name: CI / pqc-statistical-auditor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Inyectamos PYTHONPATH para que las importaciones locales de src/ funcionen siempre
    env:
      PYTHONPATH: .

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run unit test suite
      run: |
        python -m pytest tests/ -v --disable-warnings

    - name: Smoke test (Auditor Interface)
      run: |
        python -c "import auditor; print('Auditor module loaded successfully')"
